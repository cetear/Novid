        audio-modes: [ NATIVE, NONE ]
        # 按能力选项登记的视频报价表；空表表示未配置报价，不代表免费。
        prices: { }
        # 是否已核实该目标的查询不另收费；供现有预算与查询许可检查使用。
        query-free-verified: false
        # 查询原视频任务的轮询间隔，单位秒；范围 5～60。
        poll-interval-seconds: 15
        # 原视频任务的最大轮询次数；范围 1～60，还受任务剩余期限约束。
        max-polls: 60
        # 视频提交／查询单个 HTTP 请求的超时，单位秒；范围 1～60，区别于整个视频任务期限。
        timeout-seconds: 30
        # 视频提示词最大 Unicode 码点数；范围 1～20000，不按 UTF-8 字节计数。
        max-prompt-characters: 20000
