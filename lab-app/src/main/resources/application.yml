# 配置说明：${环境变量:默认值} 表示优先读取环境变量，缺失时使用冒号后的默认值。
# 本文件的模型、工具和工作流参数在应用启动时加载；修改后需重启相关服务。
# 资料任务创建时保存资源策略快照；调整工作流策略不会重置已有任务的预算。
# Spring Boot 基础配置。
spring:
  # 应用身份配置。
  application:
    # 应用名称，用于标识服务。
    name: ai-learning-lab
  # MySQL 数据源及连接池配置。
  datasource:
    # JDBC 连接地址；默认使用 ailab 库，并统一连接与会话时区为 UTC。
    url: ${DB_URL:jdbc:mysql://localhost:3306/ailab?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    # 数据库登录用户名，通过 DB_USERNAME 覆盖。
    username: ${DB_USERNAME:ailab}
    # 数据库密码，通过 DB_PASSWORD 注入；默认空值。
    password: ${DB_PASSWORD:}
    # Hikari 数据库连接池配置。
    hikari:
      # 连接池最大连接数；请求、后台任务和观测写入共享数据库资源。
      maximum-pool-size: 10
      # 从连接池获取连接的最长等待时间，单位毫秒；不是 SQL 或模型调用超时。
      connection-timeout: 5000
  # 数据库版本迁移配置。
  flyway:
    # 启动时扫描数据库迁移脚本的位置。
    locations: classpath:db/migration
    # 是否在应用启动时执行 Flyway 数据库迁移。
    enabled: true
  # HTTP JSON 编解码配置。
  jackson:
    # 请求 JSON 的反序列化规则。
    deserialization:
      # 是否拒绝 DTO 未定义的请求字段；true 时未知字段会报错。
      fail-on-unknown-properties: true
  # Servlet 请求处理配置。
  servlet:
    # 文件上传容量限制。
    multipart:
      # 单个上传文件的最大体积。
      max-file-size: 10MB
      # 整个上传请求的最大体积，包含文件和其他表单内容。
      max-request-size: 11MB
  # Spring 应用启动行为。
  main:
    # 是否允许 Bean 循环依赖；false 时启动阶段拒绝循环引用。
    allow-circular-references: false
# 日志输出、级别和归档配置。
logging:
  # Log4j2 配置文件的位置。
  config: classpath:log4j2-spring.xml
  # 日志文件位置配置。
  file:
    # 日志输出目录；应用日志和错误日志均写入此目录。
    path: ${LOG_PATH:./logs}
  # 日志级别配置；可取 TRACE、DEBUG、INFO、WARN、ERROR、OFF 等。
  level:
    # 全局默认日志级别，通过 LOG_LEVEL 覆盖。
    root: ${LOG_LEVEL:INFO}
    # 项目业务日志级别，覆盖全局级别，通过 LAB_LOG_LEVEL 调整。
    com.example.ailab: ${LAB_LOG_LEVEL:INFO}
  # 供 log4j2-spring.xml 读取的自定义滚动归档参数。
  log4j2:
    # 单个日志文件触发按大小滚动的阈值；同时按天滚动。
    max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
    # 应用日志归档保留天数，由 Log4j2 归档删除规则使用。
    max-history-days: ${LOG_MAX_HISTORY_DAYS:30}
    # 应用日志归档累计体积阈值；超过后由归档删除规则清理旧文件。
    max-archive-size: ${LOG_MAX_ARCHIVE_SIZE:1GB}
# HTTP 服务及内嵌 Tomcat 配置。
server:
  # HTTP 监听端口，通过 PORT 覆盖。
  port: ${PORT:8080}
  # 默认 HTTP 错误响应的内容控制。
  error:
    # 是否在默认错误响应中包含异常消息；never 表示不包含。
    include-message: never
    # 是否在默认错误响应中包含异常堆栈；never 表示不包含。
    include-stacktrace: never
  # 内嵌 Tomcat 的请求承载限制。
  tomcat:
    # 处理 HTTP 请求的工作线程池配置。
    threads:
      # HTTP 工作线程最大数量；不等同于后台任务或模型并发数。
      max: 32
      # Tomcat 保持的最少空闲工作线程数量。
      min-spare: 4
    # Tomcat 同时接受的最大连接数。
    max-connections: 100
    # 连接达到上限后，底层连接等待队列的容量。
    accept-count: 32
# Actuator 运行状态端点配置。
management:
  # 管理端点配置。
  endpoints:
    # 通过 HTTP 暴露管理端点的规则。
    web:
      # 管理端点开放范围。
      exposure:
        # 允许通过 HTTP 访问的管理端点；当前仅开放 health。
        include: health
  # 单个管理端点的行为配置。
  endpoint:
    # 健康检查端点配置。
    health:
      # 是否显示健康检查详情；never 表示不公开组件详情。
      show-details: never
# 本项目业务配置。
lab:
  # 资料驱动工作流策略；创建任务时保存快照，后续调整只影响新任务。
  content-workflow:
    # 所选资料原文总量上限，单位 UTF-8 字节；范围 3000～10000000。
    source-bytes: 1000000
    # 原文分片大小上限，单位 UTF-8 字节；范围 500～6000，必要时可继续拆分。
    page-bytes: 3000
    # 整个资料任务可保存的事实条目数上限；范围 8～20000。
    maximum-items: 4096
    # 知识索引工作包的容量上限，单位 UTF-8 字节；范围 6000～24000。
    index-bytes: 8000
    # 单个内容目标的事实输入包上限，单位 UTF-8 字节；须不小于 index-bytes，最大 32000。
    unit-input-bytes: 8000
    # 内容目标数量上限，如题目、整编小节或内容页；范围 1～512。
    maximum-units: 256
    # 资料子工作包线程池并发数；范围 1～16，实际还受模型网关和目标模型许可限制。
    parallelism: 8
    # 单个资料任务的逻辑模型生成轮数上限；范围 10～10000，恢复执行不重置。
    turns: 1200
    # 单个资料任务的实际模型请求次数上限，包含重试、备用及纠正；须不小于 turns，最大 20000。
    attempts: 1800
    # 单个资料任务的工具调用次数上限；范围 1～10000，恢复执行不重置。
    tools: 1200
    # 单个资料任务累计执行时间上限，单位秒；范围 1200～86400，7200 秒为 2 小时。
    execution-seconds: 7200
    # 保存工作流结果的容量边界，单位 UTF-8 字节；范围 500000～16000000。
    result-bytes: 4000000
  # S08维护显式启用；测试保持关闭，历史至少七天，每类最多100行。
  # 受控历史数据清理配置。
  governance:
    # 是否启用定时治理清理；默认关闭，启用后按现有调度分批清理。
    cleanup-enabled: false
    # 治理历史的保留天数；范围 7～365。
    retention-days: 30
    # 一次治理清理的批量上限；范围 1～100，具体类别按治理实现分批处理。
    batch-size: 100
  # S07金额为已报价部分的估算上限；没有核验价格时保持UNKNOWN，仍守硬词元／次数。
  # 应用自己的金额和词元预算；不会查询或修改供应商账户余额。
  fees:
    # 费用预算与价格表的币种，使用三位大写币种代码；CNY 表示人民币。
    currency: CNY
    # 每次在线执行的已报价部分估算金额上限，单位由 currency 决定；不是供应商账户余额。
    online-limit: 10
    # 单个后台任务的已报价部分估算金额上限；任务恢复继续使用原费用范围。
    task-limit: 30
    # 单次文档入库任务的已报价部分估算金额上限。
    ingestion-limit: 30
    # 每次在线执行的输入与输出总词元硬上限；范围 1～10000000，无报价时仍生效。
    online-tokens: 10000000
    # 单个后台任务的输入与输出总词元硬上限；范围 1～10000000，各任务独立累计。
    task-tokens: 10000000
    # 单次文档入库任务的总词元硬上限；范围 1～10000000。
    ingestion-tokens: 10000000
    # 模型价格引用表；键须与报价 ref 一致，币种须一致；空表表示未配置报价，金额状态为 UNKNOWN。
    prices: {}
  # 运行图追踪、异步存储与可选外部导出配置。
  observability:
    # 单次运行最多记录的追踪节点数；范围 1～2000，超过后标记追踪不完整。
    max-nodes: 2000
    # 异步追踪写入队列容量，单位为队列项数；范围 1～128。
    queue-capacity: 32
    # 运行追踪记录保留天数；范围 7～365。
    retention-days: 7
    # 是否向外部 OTLP 接收端导出追踪元数据。
    export-enabled: ${OBS_EXPORT_ENABLED:false}
    # OTLP HTTP 追踪接收地址；启用导出时配置完整的 /v1/traces 入口。
    otlp-endpoint: ${OBS_OTLP_ENDPOINT:}
    # OTLP 请求的 Authorization 头值，通过环境变量注入；默认空值。
    otlp-authorization: ${OBS_OTLP_AUTHORIZATION:}
  # 内置工具和外部 MCP 工具的执行配置。
  tools:
    # S05：只读模型工具暴露开关；写工具仍只能通过本人确认API。
    # 是否向模型开放已注册的只读工具；写操作仍走现有本人确认流程。
    enabled: true
    # 包含排队、授权复核、远程向量和检索；范围1～1800秒，在线仍受30秒单次上限限制。
    # 工具执行超时，包含排队和授权复核，单位秒；范围 1～1800，在线单次仍最多 30 秒。
    timeout-seconds: ${TOOL_TIMEOUT_SECONDS:1800}
    # 外部 MCP 工具连接与白名单配置。
    mcp:
      # 是否加载并连接配置中的 MCP 服务。
      enabled: true
      # 服务、远端工具名到本地别名及任务范围由服务端显式配置。
      # MCP 服务列表；工具别名与可用任务范围均由服务端配置。
      servers:
        # MCP 服务的本地唯一标识，用于区分连接和注册工具。
        - id: zhipu_search
          # 连接方式；http 使用远端 HTTP MCP 地址，stdio 使用配置的本地进程。
          transport: http
          # HTTP MCP 服务地址，不是普通模型聊天 API 地址。
          url: https://open.bigmodel.cn/api/mcp/web_search_prime/mcp
          # 连接 MCP 服务时使用的请求头；认证值通过环境变量提供。
          headers:
            # MCP Bearer 认证头；当前引用 MODEL_BACKUP_API_KEY。
            Authorization: "Bearer ${MODEL_BACKUP_API_KEY}"
          # 该服务是否为必需；true 时服务连接或必需工具注册失败会阻止正常初始化。
          required: true
          # MCP 连接及协议请求的超时，单位秒；工具执行仍受外层任务预算约束。
          timeout-seconds: 60
          # 远端工具名到本地工具别名的显式白名单映射。
          tools:
            # 将远端 web_search_prime 注册为本地别名 mcp_zhipu_search。
            web_search_prime: mcp_zhipu_search
          # 允许使用该服务工具的逻辑任务类型白名单。
          tasks: [KNOWLEDGE_QA, RESEARCH]
  # 服务端技能启用与加载目录配置。
  skills:
    # 是否加载技能目录并向工作流提供技能协议。
    enabled: ${SKILLS_ENABLED:true}
    # 分号分隔服务端目录；外部同名版本覆盖内置版本，新任务生效。
    # 额外技能目录，多个目录用分号分隔；同名外部版本覆盖内置版本，新任务生效。
    roots: ${SKILLS_ROOTS:}
  # 文档入库后台执行配置。
  ingestion:
    # 是否启用文档入库任务后台消费。
    worker-enabled: ${INGESTION_WORKER_ENABLED:true}
  # 持久任务后台执行配置。
  task:
    # 是否启用任务后台消费；关闭时已登记任务等待执行者。
    worker-enabled: ${TASK_WORKER_ENABLED:true}
  # 初始化管理员账号的配置。
  bootstrap:
    # 是否启用管理员初始化流程。
    enabled: ${BOOTSTRAP_ENABLED:false}
    # 初始化管理员的用户名，通过 BOOTSTRAP_USERNAME 覆盖。
    username: ${BOOTSTRAP_USERNAME:admin}
  # Elasticsearch 检索、认证和向量空间配置。
  search:
    # 是否启用真实 Elasticsearch 搜索连接。
    enabled: ${SEARCH_ENABLED:false}
    # Elasticsearch 服务的 HTTP(S) 地址；认证信息通过独立字段提供。
    endpoint: ${ES_URL:http://localhost:9200}
    # Elasticsearch 认证用户名；须与 password 成对配置，默认空值。
    username: ${ES_USERNAME:}
    # Elasticsearch 认证密码，通过 ES_PASSWORD 注入，默认空值。
    password: ${ES_PASSWORD:}
    # HTTPS 自定义 CA 证书文件路径，通过 ES_CA_CERTIFICATE 指定；trust-all=true 时跳过证书校验。
    ca-certificate: ${ES_CA_CERTIFICATE:}
    # 是否跳过 HTTPS 证书校验；true 跳过校验，false 使用正常信任校验。
    trust-all: ${ES_TRUST_ALL:true}
    # 知识块索引名称；应与实际入库和查询使用的索引一致。
    index: ${ES_INDEX:knowledge_chunks_mock_v1}
    # 向量维度；范围 1～4096，须与 embedding 模型输出和索引映射一致。
    dimensions: ${EMBEDDING_DIMENSIONS:32}
    # 索引使用的嵌入模型版本标识，用于限定兼容的向量空间。
    embedding-model-version: ${EMBEDDING_MODEL_NAME:mock-embedding-v1}
  # 分块与检索参数；名称含 tokens 的容量当前按 UTF-8 字节保守估算，不是供应商精确词元数。
  rag:
    # 单个知识小片的容量上限；范围 100～500，按 UTF-8 字节保守计数。
    max-chunk-tokens: 500
    # 相邻小片的重叠容量；须非负且小于 max-chunk-tokens，按 UTF-8 字节估算。
    overlap-tokens: 50
    # 小片最小容量参数；范围 1～max-chunk-tokens，按 UTF-8 字节估算。
    min-chunk-tokens: 100
    # 加入小片的标题路径前缀容量；至少 1 且小于 max-chunk-tokens，按 UTF-8 字节估算。
    heading-prefix-max-tokens: 64
    # 父段容量上限；须不小于 max-chunk-tokens，最大 2000，按 UTF-8 字节估算。
    parent-max-tokens: 2000
    # 检索合并后保留的候选知识小片数；范围 1～6。
    candidate-chunks: 6
    # 最终交给模型的证据包数量上限；范围 1～6。
    final-evidence: 6
    # 命中片段向前后扩展的邻片窗口；0 不扩展，1 最多各扩展一片。
    neighbor-window: 1
    # 最终证据总容量上限；范围 500～4000，按 UTF-8 字节保守估算。
    max-evidence-tokens: 4000
    # S02：块保留与检索参数统一绑定，修改后新处理代次使用新 configHash。
    # 每条检索路线最多召回的条目数；范围 1～20。
    retrieval-per-route: 20
    # 分块时是否尽量保持代码块完整；仍受分块容量边界约束。
    preserve-code-blocks: true
    # 分块时是否保持表格行结构；仍受分块容量边界约束。
    preserve-table-rows: true
    # 是否将章节标题路径加入分块上下文。
    include-heading-path: true
  # 模型定义、档位、任务路由和故障切换配置。
  model:
    # 模型运行模式：mock 为本地模拟，real 为真实提供方调用。
    mode: ${MODEL_MODE:mock}
    # 是否允许向外部模型发送获授权的业务内容；真实模式仍需满足权限与路由条件。
    external-data-allowed: ${MODEL_EXTERNAL_DATA_ALLOWED:false}
    # 以本地模型 ID 为键的模型定义；ID 被 profiles 的候选列表引用。
    models:
      # 主聊天模型定义。
      primary:
        # 协议适配器标识，用于选择聊天或嵌入请求的适配方式。
        provider-id: openai-compatible
        # 模型提供方 API 基础地址，通过对应环境变量覆盖。
        endpoint: ${MODEL_BASE_URL:https://api.openai.com/v1}
        # 发送给提供方的模型名称；mock 模式使用模拟定义。
        model-name: ${MODEL_PRIMARY_NAME:mock-primary}
        # 保存 API 密钥的环境变量名称；填写引用名，不是密钥正文。
        credential-ref: MODEL_API_KEY
        # 是否将此模型加入可用目标集合。
        enabled: true
        # STRUCTURED_OUTPUT采用JSON对象协议与本地Schema校验；不冒称原生JSON_SCHEMA已验证。
        # 声明目标能力；CHAT 聊天、STRUCTURED_OUTPUT JSON 对象输出、TOOLS 工具调用、EMBEDDING 嵌入。
        capabilities: [CHAT, STRUCTURED_OUTPUT, TOOLS]
        # 声明目标质量标签，须满足 profile 要求；配置标签不等于已完成实际模型评测。
        quality-tags: [configured-baseline]
        # 允许该模型处理的数据分类；PRIVATE 仍需来源授权和外发开关。
        data-classifications: [PRIVATE]
        # 声明模型上下文窗口容量（词元）；网关对输入使用 UTF-8 字节保守估算，并预留输出与结构指令。
        context-window: 200000
        # 聊天请求的最大输出词元数，同时参与窗口和费用预留；不等于整个任务的词元预算。
        output-limit: 131072
        # 模型配置范围1～1800秒；资料任务可等待30分钟，在线仍受30秒单次上限限制。
        # 模型单次等待上限，单位秒；范围 1～1800，在线调用仍最多 30 秒，资料任务还受剩余总期限限制。
        timeout-seconds: ${MODEL_PRIMARY_TIMEOUT_SECONDS:90}
      # 备用聊天模型定义；只有满足当前 profile 约束的目标才可接管。
      backup:
        # 协议适配器标识，用于选择聊天或嵌入请求的适配方式。
        provider-id: openai-compatible
        # 模型提供方 API 基础地址，通过对应环境变量覆盖。
        endpoint: ${MODEL_BACKUP_BASE_URL:${MODEL_BASE_URL:https://api.openai.com/v1}}
        # 发送给提供方的模型名称；mock 模式使用模拟定义。
        model-name: ${MODEL_BACKUP_NAME:mock-backup}
        # 保存 API 密钥的环境变量名称；填写引用名，不是密钥正文。
        credential-ref: MODEL_BACKUP_API_KEY
        # 是否将此模型加入可用目标集合。
        enabled: ${MODEL_BACKUP_ENABLED:true}
        # 声明目标能力；CHAT 聊天、STRUCTURED_OUTPUT JSON 对象输出、TOOLS 工具调用、EMBEDDING 嵌入。
        capabilities: [CHAT, STRUCTURED_OUTPUT, TOOLS]
        # 声明目标质量标签，须满足 profile 要求；配置标签不等于已完成实际模型评测。
        quality-tags: [configured-baseline]
        # 允许该模型处理的数据分类；PRIVATE 仍需来源授权和外发开关。
        data-classifications: [PRIVATE]
